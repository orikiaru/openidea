// 数据库行。头一层标量进列。vector、map、rpcdata 默认收成 PB blob。
// [db 列名] 改列名，只写 [db] 列名仍是字段名，什么都不写也一样。
// [nodb] 不进库。[nojson] 不进 JSON。[dbjson] 才把复杂字段存成 JSON 文本。
// [dbkey] 是主键字段，可以标多个组成联合主键。[dbtype 类型 长度] 换建表时的列类型。
// DbChild 给嵌套字段用。JSON 会穿透，所以它自己标 json；库不穿透，blob 里不必标 db。

rpcdata DbChild json {
    0 int32_t iNumber;
    1 string sText;
}

rpcdata DbSample json db {
    0 [db id] [dbkey, autoincrement] int64_t iId; // 写入 0 时由 MySQL 分配 id。
    1 [db] [dbtype VARBINARY 64] string sName;
    2 [nojson] int32_t iSecret;
    3 [nodb] string sCache;
    4 uint64_t iToken;
    5 double dScore;
    6 float fRatio;
    7 Bytes stPayload;
    8 vector<int32_t> vNumbers;
    9 map<string, int32_t> mFlags;
    10 DbChild stChild;
    11 int8_t iFlag;
    12 bool bActive;
    13 [dbjson] vector<int32_t> vJsonNumbers;
    14 [db notes] [dbjson] [dbtype TEXT] map<string, int32_t> mJsonFlags;
    15 [dbjson] DbChild stJsonChild;
    16 uint8_t iMask;
    17 int16_t iOffset;
    18 uint16_t iPort;
    19 uint32_t iCount;
    20 int64_t iBalance;
    21 [dbtype CHAR 4] string sCode;
    22 [dbtype VARCHAR 16] string sLabel;
    23 [dbtype BINARY 3] string sFixed;
    24 [dbtype MEDIUMTEXT] string sDescription;
    25 [dbtype LONGTEXT] string sArticle;
    26 [dbtype BLOB] Bytes stData;
    27 [dbtype MEDIUMBLOB] Bytes stArchive;
    28 map<string, vector<int32_t>> mGroups;
    29 [dbjson] vector<map<string, int32_t>> vJsonGroups;
    index idx_name(sName);
    index idx_code_id(sCode, iId); // 联合索引先按编码查找，再按主键排序。
}
