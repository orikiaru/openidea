# 规范路由索引，唯一来源。
#
# AGENTS.md「关键词对上文档」表由 `python tools/agent_route.py --write` 从这里生成，
# `--check` 校验两边一致、文档存在、正则可编译。Claude Code 的 hook 也读这里：
#   keywords  用户消息、派给 subagent 的提示词里出现就提示必读（ASCII 词按整词、不分大小写）；
#   paths     Edit/Write 的目标文件匹配这些 glob（相对仓库根）就要求先读 doc；
#   content   改 C++ 文件时新内容匹配这些正则，也要求先读 doc。
# 只有 paths、content 会拦截编辑，keywords 只提示。不填就不拦。

[[route]]
id = "coroutine"
doc = "docs/coroutine.md"
section = "硬性约束"
example = "`modules/ipcserver/src/ipcserver.cpp` 的 `RegisterRpcHandler`；`modules/ipcclient/src/echo_mgr.cpp` 的 `StartTask`；空等用 `modules/ipcclient/src/log_mgr.cpp` 的 `Pump` 里 `co_await OI::Coro::yield`"
keywords = ["协程", "Task", "StartTask", "TaskScope", "co_await", "yield", "让出", "挂起", "睡眠", "sleep", "sleep_for", "RunBlocking", "lambda", "捕获", "WhenAll"]
paths = ["cbaselib/base/inc/oi_coro*.h", "cbaselib/base/src/oi_coro*.cpp"]
content = ['\bco_await\b', '\bco_return\b', '\bStartTask\b', '\bTaskScope\b', '\bRunBlocking\b', 'Coro::yield', '\[\s*[&=]\s*[,\]]', '\bsleep_for\b', '\busleep\s*\(', '\bSleep\s*\(']

