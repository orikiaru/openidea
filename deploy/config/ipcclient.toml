# ipcclient config
[Service]
name = "ipcclient"
id = 1


[IpcClient]
ip = "127.0.0.1"
port = "17981"
type = "tcp"

# 每个测试一个管理器，自己把任务拆出去。关掉就不跑。
[Test]
echo = true
log = false

[TestEcho]
total = 1000000
timeout_ms = 180000

[TestLog]
tasks = 8
line = 65536
bytes = 1073741824
drain_sec = 15


[LogClient]
ip		= "127.0.0.1"
port	= "19995"
type   	= "tcp"

[Timer]
offset_ms = 50		#定时器间隔,必须被1000整除
timer_lv_count = 4	#定时器分割等级数,必须>=2
#每一个偏移等级对应的tick数基数
#lv[0] = timer_lvs[0]
#lv[1] = timer_lvs[0]*timer_lvs[1]
#lv[2] = timer_lvs[0]*timer_lvs[1]*timer_lvs[2]
#lv[3] = timer_lvs[0]*timer_lvs[1]*timer_lvs[2]*timer_lvs[3]
timer_lvs = [128,128,128,1] #每级定时器对应的间隔,最后一级只能是1

[ThreadPool]
normal = 3 #标准线程池数
urgent = 1 #加急线程池数
queue = 1  #有序线程池数
max_task_count = 100000
