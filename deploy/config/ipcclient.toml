# ipcclient config
[Service]
name = "ipcclient"
id = 1

# 注册进程的地址。查不到服务名时仍用下面各段的 ip/port。
[Registry]
ip = "127.0.0.1"
port = "17990"
type = "tcp"
heartbeat_ms = 1000
pull_ms = 1000
# 未发送和已发送的注册查询总上限；满时返回 OI_ERR_BUSY。
max_pending_pulls = 4096

# 命名 RPC 的连接池：相同地址、相同容量策略才共用连接。
[RpcRoute]
max_clients = 1024 # 包含正在使用和空闲的池连接；满时返回 OI_ERR_BUSY
idle_ms = 60000 # 最后一份路由租约释放后，空闲达到该时长才回收

[IpcClient]
service = "ipcserver"
ip = "127.0.0.1"
port = "17981"
type = "tcp"

# 每个测试一个管理器，自己把任务拆出去。关掉就不跑。
[Test]
echo = true
log = false
redis = false
hold = false

[TestEcho]
total = 1000000
inflight = 2048 # 同时在途的回声数，不要超过服务端 [Rpc] session_max_inflight_count
timeout_ms = 180000

[TestLog]
tasks = 8
line = 65536
bytes = 1073741824
drain_sec = 15

[TestRedis]
tasks = 8
seconds = 10
timeout_ms = 25000

# 连的是 redisserver，不是 Redis 本身
[RedisClient]
service = "redisserver"
ip = "127.0.0.1"
port = "16379"
type = "tcp"
timeout_ms = 25000


[LogClient]
service = "logd"
ip		= "127.0.0.1"
port	= "19995"
type   	= "tcp"

[Timer]
offset_ms = 50		#定时器间隔,必须被1000整除
timer_lv_count = 4	#定时器分割等级数,必须>=2
#每一个偏移等级对应的tick数基数
#lv[0] = timer_lvs[0]
#lv[1] = timer_lvs[0]*timer_lvs[1]
#lv[2] = timer_lvs[0]*timer_lvs[1]*timer_lvs[2]
#lv[3] = timer_lvs[0]*timer_lvs[1]*timer_lvs[2]*timer_lvs[3]
timer_lvs = [128,128,128,1] #每级定时器对应的间隔,最后一级只能是1

[ThreadPool]
normal = 3 #标准线程池数
urgent = 1 #加急线程池数
queue = 1  #有序线程池数
max_task_count = 100000
