# ipcclient config
[Service]
name = "ipcclient"
id = 1

# 注册进程的地址。查不到服务名时仍用下面各段的 ip/port。
# 不写 ip 就用下面的 instances，不起 registry，也不上报。配了 ip 就去 registry 拉名单。
[Registry]
ip = "127.0.0.1"
port = "17990"
type = "tcp"
heartbeat_ms = 1000
pull_ms = 1000

# 按服务名调用的连接在 RouteManager 上，配置段名 RpcRoute。
# 每个服务名一组常驻连接，跟着注册表；实例离开名单才退役。没有空闲回收，也没有客户端上限。
# 发送队列小于默认帧上限和连接前暂存（都是 64MiB），背压用例才能造出超过发送预算、仍能进暂存的包。
# 普通 Hold / AllEcho 远小于这个值。
[RpcRoute]
max_send_queue_bytes = 65536

[IpcClient]
service = "ipcserver"
ip = "127.0.0.1"
port = "17981"
type = "tcp"

# 每个测试一个管理器，自己把任务拆出去。关掉就不跑。
[Test]
echo = true
log = false
redis = false
hold = false
db = false
udp = false
multi = false
pool = false
coro = false
empty = false

# 协程压力。默认关掉，不进 --case all。要测时把 coro 改成 true，或跑 --case coro。
[TestCoro]
live = 100000
churn = 1000000

# 多连接回归。不配 service 就是写死地址的一台，实例号 0。
[IpcMultiFixed]
ip = "127.0.0.1"
port = "17981"
type = "tcp"

# 配了 service，名单里每台实例各连一条。查不到时按下面的地址连一台。
# 不配 service 时也可以写 instances = ["实例号 ip 端口 [分区]", ...]，配了就不要求 ip/port。
[IpcMulti]
service = "peerserver"
ip = "127.0.0.1"
port = "17982"
type = "tcp"

# UDP 回归的本地口。端口 0 让系统分配；idle_timeout_ms 内没收没发就关会话。
[IpcUdp]
ip = "127.0.0.1"
port = "0"
type = "udp"
idle_timeout_ms = 1500

# 对端是 ipcserver 的 [IpcUdp]。
[TestUdp]
ip = "127.0.0.1"
port = "17983"
total = 1000
notes = 1000

[TestEcho]
total = 1000000
inflight = 2048 # 同时在途的回声数，不要超过服务端 [Rpc] session_max_inflight_count
timeout_ms = 180000

# 空包压测。默认关掉，只有显式 --case empty 才开，不进 all。
[TestEmpty]
total = 1000000
inflight = 2048 # 同时在途的空包数，一条协议一个协程，不要超过服务端 [Rpc] session_max_inflight_count
timeout_ms = 180000

[TestLog]
tasks = 8
line = 65536
bytes = 1073741824
drain_sec = 15

[TestRedis]
tasks = 8
seconds = 10
timeout_ms = 25000

# 连的是 redisserver，不是 Redis 本身
[RedisClient]
service = "redisserver"
ip = "127.0.0.1"
port = "16379"
type = "tcp"
timeout_ms = 25000


[LogClient]
service = "logd"
ip		= "127.0.0.1"
port	= "19995"
type   	= "tcp"

[Timer]
offset_ms = 50		#定时器间隔,必须被1000整除
timer_lv_count = 4	#定时器分割等级数,必须>=2
#每一个偏移等级对应的tick数基数
#lv[0] = timer_lvs[0]
#lv[1] = timer_lvs[0]*timer_lvs[1]
#lv[2] = timer_lvs[0]*timer_lvs[1]*timer_lvs[2]
#lv[3] = timer_lvs[0]*timer_lvs[1]*timer_lvs[2]*timer_lvs[3]
timer_lvs = [128,128,128,1] #每级定时器对应的间隔,最后一级只能是1

[ThreadPool]
threadcount = 3 #协程工人线程数
