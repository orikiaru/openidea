# This is a TOML document

# name代表服务名
# id代表服务id
[Service]
name = "logd"
id = 1

[Registry]
ip = "127.0.0.1"
port = "17990"
type = "tcp"
heartbeat_ms = 1000
pull_ms = 1000

[Log]
root_path = "./logs"
# 所有级别共享的待写字节上限，包含正在写入/尚未 fflush 的批次及每条时间前缀。
# 最小 8388616（最大合法正文 + 9 字节时间前缀）；不是进程 RSS 或接收缓冲上限。
# 满时暂停网络读取；本地日志返回 false，不阻塞 poll，也不另建无界缓存。
max_pending_bytes = 67108864

[ThreadPool]
threadcount = 3 #协程工人线程数

[Timer]
offset_ms = 50		#定时器间隔,必须被1000整除
timer_lv_count = 4	#定时器分割等级数,必须>=2
#每一个偏移等级对应的tick数基数
#lv[0] = timer_lvs[0]
#lv[1] = timer_lvs[0]*timer_lvs[1]
#lv[2] = timer_lvs[0]*timer_lvs[1]*timer_lvs[2]
#lv[3] = timer_lvs[0]*timer_lvs[1]*timer_lvs[2]*timer_lvs[3]
timer_lvs = [128,128,128,1] #每级定时器对应的间隔,最后一级只能是1

# ip port 必须为字符串.
# logd 自己的日志直接写本地，不配 [LogClient]。
[LogServer]
ip		= "127.0.0.1"
port	= "19995"
type   	= "tcp"
# 对外映射。IP 和端口都可以和上面的监听不一样。
# advertise_ip = "203.0.113.10"
# advertise_port = "29995"
