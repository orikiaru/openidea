# webserver config
[Service]
name = "webserver"
id = 1

[Registry]
ip = "127.0.0.1"
port = "17990"
type = "tcp"
heartbeat_ms = 1000
expire_ms = 3000
pull_ms = 1000

[Redis]
ip = "127.0.0.1"
port = "6379"

# 只听 HTTP。query、JSON、二进制 body 由 cpp-httplib 和 JsonCpp 处理。
[WebServer]
ip = "127.0.0.1"
port = 18080
