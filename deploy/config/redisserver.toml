# redisserver config
[Service]
name = "redisserver"
id = 1

[Registry]
ip = "127.0.0.1"
port = "17990"
type = "tcp"
heartbeat_ms = 1000
expire_ms = 3000
pull_ms = 1000

# 给 ipcclient 听的地址
[RedisServer]
ip = "127.0.0.1"
port = "16379"
type = "tcp"
# 对外映射。IP 和端口都可以和上面的监听不一样。
# advertise_ip = "203.0.113.10"
# advertise_port = "26379"

# 真正的 Redis。只有这个进程用 hiredis 去连。connections 是上游连接数。
[Redis]
ip = "127.0.0.1"
port = "6379"
connections = 4

[LogClient]
service = "logd"
ip		= "127.0.0.1"
port	= "19995"
type   	= "tcp"

[Timer]
offset_ms = 50
timer_lv_count = 4
timer_lvs = [128,128,128,1]

[ThreadPool]
normal = 3
urgent = 1
queue = 1
max_task_count = 100000
