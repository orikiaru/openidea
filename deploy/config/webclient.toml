# webclient config
[Service]
name = "webclient"
id = 1

[ThreadPool]
threadcount = 3 # 协程工人线程数

# 注册进程的地址。查不到服务名时仍用下面各段的 ip/port。
[Registry]
ip = "127.0.0.1"
port = "17990"
type = "tcp"
heartbeat_ms = 1000
pull_ms = 1000

# HTTPS 可选指定 CA 文件；留空使用系统信任库。
[WebClient]
ip = "127.0.0.1"
port = 18080
# 单次请求从入队起算的超时；同一客户端默认串行复用连接。
timeout_ms = 5000
reuse = true
https = false
ca_file = ""
