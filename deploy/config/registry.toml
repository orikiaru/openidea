# registry config
[Service]
name = "registry"
id = 1

# 注册进程自己的地址。别的进程靠这一段来找它，不能再向注册表查。
[Registry]
ip = "127.0.0.1"
port = "17990"
type = "tcp"
# 对外映射。IP 和端口都可以和上面的监听不一样。
# advertise_ip = "203.0.113.10"
# advertise_port = "27990"
heartbeat_ms = 1000
expire_ms = 3000
pull_ms = 1000

# 表和日志写到这台 Redis。redisserver 对外的地址另外登记，靠服务名找。
[Redis]
ip = "127.0.0.1"
port = "6379"

[LogClient]
service = "logd"
ip		= "127.0.0.1"
port	= "19995"
type   	= "tcp"

[Timer]
offset_ms = 50
timer_lv_count = 4
timer_lvs = [128,128,128,1]

[ThreadPool]
normal = 1
urgent = 1
queue = 1
max_task_count = 100000
