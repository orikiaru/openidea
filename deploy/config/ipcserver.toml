# ipcserver config
[Service]
name = "ipcserver"
id = 1

# 注册进程的地址。查不到服务名时仍用下面各段的 ip/port。
[Registry]
ip = "127.0.0.1"
port = "17990"
type = "tcp"
heartbeat_ms = 1000
pull_ms = 1000

[IpcServer]
# 每会话未解析字节上限；必须至少为 max_frame_bytes + 8（协议头）。
max_receive_buffer_bytes = 67108872
# RPC 正文上限，收到包头立即检查，不等正文到齐；与 [Rpc] 执行中额度独立。
max_frame_bytes = 67108864
# 从残包首次出现开始计时，滴流不延期；完整包取消计时，空闲连接不受影响。
incomplete_frame_timeout_ms = 10000
ip = "127.0.0.1"
port = "17981"
type = "tcp"
# 对外映射。IP 和端口都可以和上面的监听不一样。
# advertise_ip = "203.0.113.10"
# advertise_port = "27981"


# 起服后发一次 GET 看 HTTP 客户端。host 不填就不发，压测时别打开。
[HttpProbe]
# host = "www.baidu.com"
port = 80
path = "/"
timeout_ms = 5000

[LogClient]
service = "logd"
ip		= "127.0.0.1"
port	= "19995"
type   	= "tcp"

[Timer]
offset_ms = 50		#定时器间隔,必须被1000整除
timer_lv_count = 4	#定时器分割等级数,必须>=2
#每一个偏移等级对应的tick数基数
#lv[0] = timer_lvs[0]
#lv[1] = timer_lvs[0]*timer_lvs[1]
#lv[2] = timer_lvs[0]*timer_lvs[1]*timer_lvs[2]
#lv[3] = timer_lvs[0]*timer_lvs[1]*timer_lvs[2]*timer_lvs[3]
timer_lvs = [128,128,128,1] #每级定时器对应的间隔,最后一级只能是1

[ThreadPool]
normal = 3 #标准线程池数
urgent = 1 #加急线程池数
queue = 1  #有序线程池数
max_task_count = 100000

# RPC 在途限制：请求被接纳后至处理协程结束前占用额度，结束后自动归还。
# 四项均须为正整数；任一限额不足时返回 OI_ERR_BUSY，不执行该请求的业务处理。
# 字节数按请求包体（含调用号）统计，不包含响应、网络缓冲和其他业务内存，不是进程内存上限。
[Rpc]
# 整个进程最多同时处理的请求数，所有会话合计。
max_inflight_count = 65536
# 整个进程在途请求包体总字节数，默认 64 MiB。
max_inflight_bytes = 67108864
# 每条会话最多同时处理的请求数，防止单条连接耗尽进程额度。
session_max_inflight_count = 4096
# 每条会话在途请求包体总字节数，默认 16 MiB。
session_max_inflight_bytes = 16777216
